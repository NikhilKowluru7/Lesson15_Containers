<!DOCTYPE html>
<html lang="en">
<head>
    <title>Hobby Card</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
</head>
<body>
    <div class = "container bg-primary p-4 border border-10 rounded-pill my-3 border-dark">
        <h1>My Hobby Card</h1>
        <p>These are all my hobbies!</p>
    </div>
    <div class = "container-fluid bg-danger p-2 my-4 border border-primary border-5 rounded-lg text-warning">
        <h2>Sports</h2>
        <p>I play football 3 times a week and swimming once.</p>
    </div>
    <div class="container-fluid bg-warning p-2 my-4 border border-primary border-5 rounded-lg text-light">
        <h2>Reading</h2>
        <p>I read books every night.</p>
    </div>
    <div class="container-fluid bg-light p-2 my-4 border border-primary border-5 rounded-lg text-info">
            <h2>Coding</h2>
            <p>I like to do coding!</p>
    </div>
        <div class="container-fluid bg-secondary p-2 my-4 border border-primary border-5 rounded-lg text-warning">
            <h2>Gaming</h2>
            <p>I love to play videogames!</p>
        </div>
            <div class="container-fluid bg-info p-2 my-4 border border-primary border-5 rounded-lg text-danger">
                <h2>Hiking</h2>
                <p>I really like hiking mountains and scenic places!</p>
            </div>
</body>
</html>
